<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor">
  <!-- Blueprint Suspension Bridge & Skyline Wireframe -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <!-- Pylons / Towers -->
    <line x1="120" y1="280" x2="120" y2="60" />
    <line x1="135" y1="280" x2="135" y2="60" />
    <line x1="280" y1="280" x2="280" y2="60" />
    <line x1="295" y1="280" x2="295" y2="60" />
    <!-- Cross struts -->
    <line x1="120" y1="120" x2="135" y2="120" />
    <line x1="120" y1="180" x2="135" y2="180" />
    <line x1="280" y1="120" x2="295" y2="120" />
    <line x1="280" y1="180" x2="295" y2="180" />
    <!-- Road deck -->
    <line x1="10" y1="200" x2="390" y2="200" stroke-width="2.5" />
    <line x1="10" y1="208" x2="390" y2="208" stroke-width="1" />
    <!-- Main suspension cables -->
    <path d="M10 120 Q65 190, 127 60" fill="none" />
    <path d="M128 60 Q207 195, 287 60" fill="none" />
    <path d="M288 60 Q345 190, 390 120" fill="none" />
    <!-- Vertical stay suspenders -->
    <line x1="150" y1="130" x2="150" y2="200" stroke-dasharray="2 2" />
    <line x1="170" y1="160" x2="170" y2="200" stroke-dasharray="2 2" />
    <line x1="190" y1="175" x2="190" y2="200" stroke-dasharray="2 2" />
    <line x1="210" y1="180" x2="210" y2="200" stroke-dasharray="2 2" />
    <line x1="230" y1="175" x2="230" y2="200" stroke-dasharray="2 2" />
    <line x1="250" y1="160" x2="250" y2="200" stroke-dasharray="2 2" />
    <line x1="270" y1="130" x2="270" y2="200" stroke-dasharray="2 2" />
  </g>
</svg>

  <!-- Subtitle: CONSTRUCTIONS -->
  <text x="65" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="3.2" fill="#64748b">

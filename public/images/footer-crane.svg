<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor">
  <!-- Blueprint Construction Tower Crane Outline -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <!-- Mast / Tower -->
    <line x1="80" y1="280" x2="80" y2="40" />
    <line x1="100" y1="280" x2="100" y2="40" />
    <!-- Lattice bracing -->
    <line x1="80" y1="280" x2="100" y2="250" />
    <line x1="100" y1="250" x2="80" y2="220" />
    <line x1="80" y1="220" x2="100" y2="190" />
    <line x1="100" y1="190" x2="80" y2="160" />
    <line x1="80" y1="160" x2="100" y2="130" />
    <line x1="100" y1="130" x2="80" y2="100" />
    <line x1="80" y1="100" x2="100" y2="70" />
    <line x1="100" y1="70" x2="80" y2="40" />
    <!-- Jib (Horizontal boom) -->
    <line x1="20" y1="40" x2="360" y2="40" />
    <line x1="20" y1="50" x2="360" y2="50" />
    <!-- Jib lattice -->
    <line x1="100" y1="40" x2="130" y2="50" />
    <line x1="130" y1="50" x2="160" y2="40" />
    <line x1="160" y1="40" x2="190" y2="50" />
    <line x1="190" y1="50" x2="220" y2="40" />
    <line x1="220" y1="40" x2="250" y2="50" />
    <line x1="250" y1="50" x2="280" y2="40" />
    <line x1="280" y1="40" x2="310" y2="50" />
    <line x1="310" y1="50" x2="340" y2="40" />
    <!-- Apex Tower Top & Tie cables -->
    <line x1="90" y1="40" x2="90" y2="10" />
    <line x1="90" y1="10" x2="300" y2="40" />
    <line x1="90" y1="10" x2="30" y2="40" />
    <!-- Counterweight -->
    <rect x="25" y="42" width="30" height="20" fill="none" stroke="#ffffff" />
    <!-- Trolley and Hook Line -->
    <rect x="240" y="48" width="12" height="6" />
    <line x1="246" y1="54" x2="246" y2="140" stroke-dasharray="3 3" />
    <path d="M242 140 C242 148, 250 148, 250 140" fill="none" />
  </g>
</svg>
